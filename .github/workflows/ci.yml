name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "feature_*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python package and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python package
        run: python -m pip install -e "python/sibcp[serial]"

      - name: Package import smoke test
        run: python -c "import sibcp, rjscm; print(sibcp.__name__, rjscm.__name__)"

      - name: Run Python tests
        run: python -m unittest discover -s python/sibcp/tests

  c-wrapper:
    name: C/C++ wrapper tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S c/rjscm -B build/rjscm

      - name: Build
        run: cmake --build build/rjscm

      - name: Test
        run: ctest --test-dir build/rjscm --output-on-failure

      - name: Install smoke test
        run: cmake --install build/rjscm --prefix build/rjscm-install

  firmware:
    name: ESP32-C5 firmware build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32-C5 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32c5
          path: firmware/RCj_comm_module
